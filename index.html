<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>وكيل الأوردرات الذكي — ai provider</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 680px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 14px;
      margin-bottom: 14px;
    }
    .title { margin: 0; font-size: 1.15rem; }
    .subtitle { margin: 4px 0 0; font-size: 0.85rem; color: #94a3b8; }
    .badge {
      background: #064e3b;
      color: #6ee7b7;
      border: 1px solid #10b981;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .btn-secondary {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
    }
    .chat-box {
      height: 360px;
      overflow-y: auto;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .msg {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-line;
      font-size: 0.92rem;
    }
    .bot {
      align-self: flex-start;
      background: #1e293b;
      color: #f1f5f9;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: #ffffff;
    }
    .wa-link {
      display: inline-block;
      margin-top: 8px;
      background: #16a34a;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .unlock-box {
      background: #172554;
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .unlock-box input {
      flex: 1;
      min-width: 180px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    .input-row input {
      flex: 1;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.95rem;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 0 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div>
        <h1 class="title">وكيل الأوردرات الذكي — ai provider</h1>
        <p class="subtitle">قهوة مختارة • تمور فاخرة • ساعات</p>
      </div>
      <div class="badge" id="quotaBadge">المتبقي: 3 / 3</div>
    </div>

    <div class="controls">
      <label>
        <input type="checkbox" id="useGeminiToggle" />
        استخدام Gemini المباشر (يستهلك رصيد)
      </label>
      <button type="button" class="btn-secondary" id="resetBtn">تصفير العداد</button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">أهلاً بك في ai provider! يمكنني مساعدتك في اختيار (القهوة، التمور، الساعات) وتجهيز بطاقة أوردر جاهزة للتنفيذ. كيف أساعدك اليوم؟</div>
    </div>

    <div class="unlock-box" id="unlockBox">
      <span>انتهت الرسائل المجانية (3/3). أدخل رمز التفعيل للمتابعة:</span>
      <input type="text" id="codeInput" placeholder="أدخل رمز التفعيل (مثال: AIPR-PRO)" />
      <button type="button" class="btn-secondary" id="unlockBtn">تفعيل</button>
    </div>

    <form class="input-row" id="chatForm">
      <input type="text" id="msgInput" placeholder="اكتب سؤالك أو طلبك هنا..." autocomplete="off" required />
      <button type="submit" class="btn-primary" id="sendBtn">إرسال</button>
    </form>
  </div>

  <script>
    const MODEL_NAME = "gemini-3.8-flash";
    const WHATSAPP_NUMBER = "970567375571";
    const FREE_LIMIT = 3;
    const ACTIVATION_CODE = "AIPR-PRO";

    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const quotaBadge = document.getElementById("quotaBadge");
    const resetBtn = document.getElementById("resetBtn");
    const useGeminiToggle = document.getElementById("useGeminiToggle");
    const unlockBox = document.getElementById("unlockBox");
    const codeInput = document.getElementById("codeInput");
    const unlockBtn = document.getElementById("unlockBtn");

    let usedCount = Number(localStorage.getItem("aipr_used_count") || "0");
    let isUnlocked = localStorage.getItem("aipr_unlocked") === "true";

    function updateUI() {
      if (isUnlocked) {
        quotaBadge.textContent = "مفعّل";
        unlockBox.style.display = "none";
        msgInput.disabled = false;
        sendBtn.disabled = false;
        return;
      }
      const remaining = Math.max(0, FREE_LIMIT - usedCount);
      quotaBadge.textContent = `المتبقي: ${remaining} / ${FREE_LIMIT}`;
      if (remaining <= 0) {
        unlockBox.style.display = "flex";
        msgInput.disabled = true;
        sendBtn.disabled = true;
      } else {
        unlockBox.style.display = "none";
        msgInput.disabled = false;
        sendBtn.disabled = false;
      }
    }

    function appendMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.textContent = text;

      if (sender === "bot" && text.includes("بطاقة أوردر جاهز للتنفيذ")) {
        const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
        const link = document.createElement("a");
        link.href = waUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.className = "wa-link";
        link.textContent = "إرسال الأوردر عبر واتساب";
        div.appendChild(document.createElement("br"));
        div.appendChild(link);
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    resetBtn.addEventListener("click", () => {
      usedCount = 0;
      isUnlocked = false;
      localStorage.setItem("aipr_used_count", "0");
      localStorage.setItem("aipr_unlocked", "false");
      updateUI();
    });

    unlockBtn.addEventListener("click", () => {
      if (codeInput.value.trim().toUpperCase() === ACTIVATION_CODE) {
        isUnlocked = true;
        localStorage.setItem("aipr_unlocked", "true");
        codeInput.value = "";
        updateUI();
      } else {
        alert("رمز التفعيل غير صحيح.");
      }
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = msgInput.value.trim();
      if (!message) return;

      if (!isUnlocked && usedCount >= FREE_LIMIT) {
        updateUI();
        return;
      }

      appendMessage(message, "user");
      msgInput.value = "";

      if (!isUnlocked) {
        usedCount += 1;
        localStorage.setItem("aipr_used_count", String(usedCount));
        updateUI();
      }

      sendBtn.disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            useGemini: useGeminiToggle.checked
          })
        });
        const data = await res.json();
        appendMessage(data.reply || "تعذر إتمام الطلب حالياً.", "bot");
      } catch (err) {
        appendMessage("تعذر الاتصال بالخادم حالياً.", "bot");
      } finally {
        updateUI();
      }
    });

    updateUI();
  </script>
</body>
</html>
